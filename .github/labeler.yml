# Rules for actions/labeler, applied by .github/workflows/triage.yaml.
#
# The vendor/* labels are the gates for the multi-vendor test matrix in
# .github/workflows/unittest.yaml: a backend is scheduled only when its label
# is on the PR (unless it is nvidia, which runs on every PR). The label and
# the path must stay in step with .github/backends.json, which pairs each
# vendor with the label and the runner.
#
# Every label below must exist in the repository before triage can apply it --
# actions/labeler does not create them.

vendor/NVIDIA:
  - changed-files:
      - any-glob-to-any-file: src/flag_train/runtime/backend/_nvidia/**

vendor/Ascend:
  - changed-files:
      - any-glob-to-any-file: src/flag_train/runtime/backend/_ascend/**

vendor/Hygon:
  - changed-files:
      - any-glob-to-any-file: src/flag_train/runtime/backend/_hygon/**

vendor/Iluvatar:
  - changed-files:
      - any-glob-to-any-file: src/flag_train/runtime/backend/_iluvatar/**

vendor/MetaX:
  - changed-files:
      - any-glob-to-any-file: src/flag_train/runtime/backend/_metax/**

vendor/THead:
  - changed-files:
      - any-glob-to-any-file: src/flag_train/runtime/backend/_thead/**

tests:
  - changed-files:
      - any-glob-to-any-file: tests/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "**/*.md"
