ops:
- id: bias_swiglu_impl
  description: 'Bias plus SwiGLU fusion: bias add, gate/linear split, and SwiGLU in one
    kernel. Forward only; the clamped and SiTU-GLU variants are selected by arguments.'
  for:
  - bias_swiglu_impl
  labels:
  - megatron
  - activation
  from:
  - megatron
  kind:
  - Activation
  source: megatron.core.fusions.fused_bias_swiglu
  stages:
  - beta: '0.0.0'
- id: blocked_flash
  description: Blocked flash attention over paged KV-cache blocks.
  for:
  - BlockedFlashAttn
  labels:
  - deepspeed
  - attention
  from:
  - deepspeed
  kind:
  - Attention
  source: deepspeed.inference.v2.kernels.ragged_ops
  stages:
  - beta: '0.0.0'
- id: cuda_wf6af16_linear
  description: Linear layer with FP6-E3M2 weights and FP16 activations.
  for:
  - cuda_wf6af16_linear
  labels:
  - deepspeed
  - quantization
  - linear
  from:
  - deepspeed
  kind:
  - Quantization
  source: deepspeed.ops.op_builder.InferenceCoreBuilder
  stages:
  - beta: '0.0.0'
- id: evoformer_attn
  description: Evoformer attention forward kernel (the backward pass is not ported).
  for:
  - DS4Sci_EvoformerAttention
  labels:
  - deepspeed
  - attention
  - evoformer
  from:
  - deepspeed
  kind:
  - Attention
  source: deepspeed.ops.deepspeed4science
  stages:
  - beta: '0.0.0'
- id: fast_gelu
  description: 'FastGELU activation: 0.5 * x * (1 + tanh(0.7978845608 * x * (1 + 0.044715 * x * x))).'
  for:
  - fast_gelu
  labels:
  - megatron
  - activation
  from:
  - megatron
  kind:
  - Activation
  source: megatron.core.activations
  stages:
  - beta: '0.0.0'
- id: fused_gated_norm
  description: 'Fused RMSNorm over the trailing dim plus SiLU gating, with an optional
    zero-centered weight offset. Forward only; the normalised activation is materialised
    before the fp32 gating multiply, as upstream does.'
  for:
  - fused_gated_norm
  labels:
  - megatron
  - normalization
  - activation
  from:
  - megatron
  kind:
  - Normalization
  source: megatron.core.fusions.fused_gated_norm
  stages:
  - beta: '0.0.0'
- id: fused_h_aggregate_backward
  description: Gradients of fused_h_aggregate_forward with respect to x and h_pre, the
    backward of the mHC h_aggregate stage.
  for:
  - _torch_h_aggregate_bwd
  labels:
  - megatron
  - tensor
  from:
  - megatron
  kind:
  - Tensor
  source: megatron.core.fusions.fused_mhc_kernels
  stages:
  - beta: '0.0.0'
- id: fused_h_aggregate_forward
  description: 'Collapses the n mHC residual streams into one: out[s, b, c] = sum_i
    h_pre[s, b, i] * x[s, b, i, c].'
  for:
  - native_h_aggregate
  - FusedHAggregate
  labels:
  - megatron
  - tensor
  from:
  - megatron
  kind:
  - Tensor
  source: megatron.core.fusions.fused_mhc_kernels
  stages:
  - beta: '0.0.0'
- id: fused_h_post_bda_backward
  description: Gradients of fused_h_post_bda_forward with respect to all inputs and optional bias.
  for:
  - fused_h_post_bda_backward
  labels:
  - megatron
  - hyper-connection
  - linear
  from:
  - megatron
  kind:
  - Linear
  source: megatron.core.fusions.fused_mhc_kernels
  stages:
  - beta: '0.0.0'
- id: fused_h_post_bda_forward
  description: 'Fused mHC H_post BDA: H_res.T @ original_residual + h_post * (x + bias).'
  for:
  - fused_h_post_bda_forward
  labels:
  - megatron
  - hyper-connection
  - linear
  from:
  - megatron
  kind:
  - Linear
  source: megatron.core.fusions.fused_mhc_kernels
  stages:
  - beta: '0.0.0'
- id: fused_indices_to_multihot
  description: Converts fused expert indices and routing probabilities into a multi-hot mask.
  for:
  - fused_indices_to_multihot
  labels:
  - megatron
  - moe
  from:
  - megatron
  kind:
  - MoE
  source: megatron.core.fusions.fused_indices_converter
  stages:
  - beta: '0.0.0'
- id: fused_pad_routing_map
  description: Pads a token-to-expert routing map to a multiple of pad_multiple.
  for:
  - fused_pad_routing_map
  labels:
  - megatron
  - moe
  from:
  - megatron
  kind:
  - MoE
  source: megatron.core.fusions.fused_pad_routing_map
  stages:
  - beta: '0.0.0'
- id: fused_proj_rms_backward
  description: Gradients of fused_proj_rms_forward with respect to x and weight.
  for:
  - fused_proj_rms_backward
  labels:
  - megatron
  - linear
  - normalization
  from:
  - megatron
  kind:
  - Normalization
  source: megatron.core.transformer.hyper_connection
  stages:
  - beta: '0.0.0'
- id: fused_proj_rms_compute_h_backward
  description: Gradients of fused_proj_rms_compute_h_forward with respect to x, weight, the gating factors and bias.
  for:
  - fused_proj_rms_compute_h_backward
  labels:
  - megatron
  - linear
  - normalization
  from:
  - megatron
  kind:
  - Normalization
  source: megatron.core.fusions.fused_mhc_kernels
  stages:
  - beta: '0.0.0'
- id: fused_proj_rms_compute_h_forward
  description: Fused projection, RMS scale, and the mHC H_pre / H_post / H_res mapping outputs.
  for:
  - fused_proj_rms_compute_h_forward
  labels:
  - megatron
  - linear
  - normalization
  from:
  - megatron
  kind:
  - Normalization
  source: megatron.core.fusions.fused_mhc_kernels
  stages:
  - beta: '0.0.0'
- id: fused_proj_rms_forward
  description: Fused projection (x @ weight^T) and RMS scale 1 / (||x|| / sqrt(K) + eps).
  for:
  - fused_proj_rms_forward
  labels:
  - megatron
  - linear
  - normalization
  from:
  - megatron
  kind:
  - Normalization
  source: megatron.core.transformer.hyper_connection
  stages:
  - beta: '0.0.0'
- id: lamb
  description: Fused LAMB optimizer update.
  for:
  - fused_lamb
  labels:
  - deepspeed
  - optimizer
  from:
  - deepspeed
  kind:
  - Optimizer
  source: deepspeed.ops.op_builder.FusedLambBuilder
  stages:
  - beta: '0.0.0'
- id: mixed_gemm
  description: Mixed-precision GEMM with weight-only integer quantization.
  for:
  - mixed_gemm
  labels:
  - deepspeed
  - gemm
  - quantization
  from:
  - deepspeed
  kind:
  - Quantization
  stages:
  - beta: '0.0.0'
- id: mixed_moe_gemm
  description: Grouped GEMM for mixed-precision MoE experts.
  for:
  - mixed_moe_gemm
  labels:
  - deepspeed
  - moe
  - gemm
  from:
  - deepspeed
  kind:
  - MoE
  stages:
  - beta: '0.0.0'
- id: multi_tensor_adam
  description: Fused Adam/AdamW optimizer update over multiple parameter tensors.
  for:
  - multi_tensor_adam
  labels:
  - deepspeed
  - optimizer
  from:
  - deepspeed
  kind:
  - Optimizer
  source: deepspeed.ops.op_builder.FusedAdamBuilder
  stages:
  - beta: '0.0.0'
- id: multi_tensor_lion
  description: Fused Lion optimizer update over multiple parameter tensors.
  for:
  - multi_tensor_lion
  labels:
  - deepspeed
  - optimizer
  from:
  - deepspeed
  kind:
  - Optimizer
  source: deepspeed.ops.op_builder.FusedLionBuilder
  stages:
  - beta: '0.0.0'
- id: packbits
  description: Packs floating-point values into uint8 bit-fields along a dimension.
  for:
  - packbits
  labels:
  - deepspeed
  - tensor
  from:
  - deepspeed
  kind:
  - Tensor
  stages:
  - beta: '0.0.0'
- id: quick_gelu
  description: 'QuickGELU activation: x * sigmoid(1.702 * x).'
  for:
  - quick_gelu
  labels:
  - megatron
  - activation
  from:
  - megatron
  kind:
  - Activation
  source: megatron.core.activations
  stages:
  - beta: '0.0.0'
- id: scaled_masked_softmax_cuda_backward
  description: 'Gradient of the scaled masked softmax with respect to the scores:
    scale * y * (dy - sum(dy * y)) over the key axis.'
  for:
  - ScaledMaskedSoftmax
  labels:
  - megatron
  - attention
  - softmax
  from:
  - megatron
  kind:
  - Attention
  source: megatron.core.fusions.fused_softmax
  stages:
  - beta: '0.0.0'
- id: scaled_masked_softmax_cuda_forward
  description: 'Scaled softmax over the key axis with a per-query bool mask: masked
    keys are dropped and a fully masked row comes out as zeros.'
  for:
  - ScaledMaskedSoftmax
  labels:
  - megatron
  - attention
  - softmax
  from:
  - megatron
  kind:
  - Attention
  source: megatron.core.fusions.fused_softmax
  stages:
  - beta: '0.0.0'
- id: scaled_upper_triang_masked_softmax_forward
  description: Scaled softmax with Megatron's upper-triangular causal mask; masked entries are zero.
  for:
  - ScaledUpperTriangMaskedSoftmax
  labels:
  - megatron
  - attention
  - softmax
  from:
  - megatron
  kind:
  - Attention
  source: megatron.core.fusions.fused_softmax
  stages:
  - beta: '0.0.0'
- id: unpackbits
  description: Unpacks uint8 bit-fields into floating-point values along a dimension.
  for:
  - unpackbits
  labels:
  - deepspeed
  - tensor
  from:
  - deepspeed
  kind:
  - Tensor
  stages:
  - beta: '0.0.0'
- id: weighted_squared_relu_impl
  description: Squared-ReLU activation with optional per-token weights and an optional
    tanh soft clamp. Forward only.
  for:
  - weighted_squared_relu_impl
  labels:
  - megatron
  - activation
  from:
  - megatron
  kind:
  - Activation
  source: megatron.core.fusions.fused_weighted_squared_relu
  stages:
  - beta: '0.0.0'
